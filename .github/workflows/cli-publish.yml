name: CLI - Publish to npm and GitHub

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean

  push:
    tags:
      - 'cli/v*'  # Tag push: publish to npm + create GitHub release
    # No `paths:` filter: GitHub ignores path filters for tag pushes, so one
    # here would never take effect.

permissions:
  contents: read

jobs:
  publish:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push version bump branch, create PR, and create GitHub release
      pull-requests: write # needed to open the version bump PR
      id-token: write      # required for OIDC authentication to npm registry
      attestations: write  # attest the npm tarball (also attached to the GitHub release)
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.2.2'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: |
            vscode-extension/pnpm-lock.yaml
            cli/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: vscode-extension

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production bundle
        run: pnpm run build:production

      - name: Validate CLI works
        run: node dist/cli.js --help

      - name: Determine trigger type
        id: trigger_type
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$GIT_REF" == refs/tags/cli/v* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            TAG_VERSION=${GIT_REF#refs/tags/cli/v}
            echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            echo "Triggered by tag push: cli/v$TAG_VERSION"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag_version=" >> "$GITHUB_OUTPUT"
            echo "Triggered by workflow_dispatch"
          fi
        working-directory: .

      - name: Bump version (workflow_dispatch only)
        if: steps.trigger_type.outputs.is_tag != 'true'
        run: pnpm version ${{ inputs.version_bump }} --no-git-tag-version

      - name: Verify version matches tag (tag trigger only)
        if: steps.trigger_type.outputs.is_tag == 'true'
        run: |
          PACKAGE_VERSION=$(node -p 'require("./package.json").version')
          TAG_VERSION="${{ steps.trigger_type.outputs.tag_version }}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "  package.json: $PACKAGE_VERSION"
            echo "  tag:          $TAG_VERSION"
            echo "Please ensure the version in cli/package.json matches the pushed tag."
            exit 1
          fi
          echo "✅ Version check passed: $PACKAGE_VERSION"

      - name: Get new version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: check_published
        run: |
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking npm registry for ${PACKAGE_NAME}@${VERSION}..."
          if pnpm view "${PACKAGE_NAME}@${VERSION}" version 2>&1; then
            echo "Version ${VERSION} is already published to npm. Skipping publish."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} is not yet published. Proceeding with publish."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Pack once and publish that exact tarball, so the file attested below, the file
      # npm serves and the file attached to the GitHub release are the same bytes.
      - name: Pack npm tarball
        id: pack
        run: |
          # Publishing a tarball skips the hooks `pnpm publish` runs around its own pack
          # (prepack/prepare/postpack still run here). Fail rather than silently drop one.
          HOOKS=$(node -p 'Object.keys(require("./package.json").scripts||{}).filter(s=>["prepublishOnly","prepublish","publish","postpublish"].includes(s)).join(" ")')
          if [ -n "$HOOKS" ]; then
            echo "::error::package.json defines publish lifecycle scripts ($HOOKS) that tarball publishing would skip. Move them to prepack or run them explicitly here."
            exit 1
          fi
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          rm -rf "$PACK_DIR" && mkdir -p "$PACK_DIR"
          pnpm pack --pack-destination "$PACK_DIR"
          shopt -s nullglob
          TARBALLS=("$PACK_DIR"/*.tgz)
          if [ ${#TARBALLS[@]} -ne 1 ]; then
            echo "::error::Expected exactly one tarball in $PACK_DIR, found ${#TARBALLS[@]}"
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          echo "sha256 $(sha256sum "$TARBALL" | cut -d' ' -f1)  $TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # GitHub build-provenance attestation for the tarball (verifiable with
      # `gh attestation verify`), on top of the npm provenance `--provenance` adds.
      - name: Attest and verify the npm tarball
        if: ${{ !inputs.dry_run && steps.check_published.outputs.already_published != 'true' }}
        uses: $/.github/actions/attest-files
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: ${{ !inputs.dry_run && steps.check_published.outputs.already_published != 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pnpm publish "$TARBALL" --provenance --access public --no-git-checks

      - name: Dry run publish
        if: ${{ inputs.dry_run }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pnpm publish "$TARBALL" --provenance --access public --no-git-checks --dry-run

      # Before anything else is promoted (version-bump PR, GitHub release): prove npm
      # serves the attested tarball and holds its SLSA provenance. A different integrity
      # or missing provenance (exit 1) fails here and stops the release. If the version
      # only has not shown up within ~15 minutes (exit 2, registry lag), the release
      # steps still run: they ship the local attested tarball, not npm's copy, and a
      # re-run cannot recover them (check_published skips everything once npm has the
      # version). The "Re-verify" step at the end then checks npm again and fails the
      # run if it still cannot confirm the tarball.
      - name: Verify the published package matches the attested tarball
        id: verify
        if: ${{ !inputs.dry_run && steps.check_published.outputs.already_published != 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          rc=0
          bash ../.github/workflows/scripts/verify-npm-publish.sh "$PACKAGE_NAME" "$VERSION" "$TARBALL" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::${PACKAGE_NAME}@${VERSION} is not visible on npm yet; continuing the release and re-verifying at the end of this run."
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Commit version bump and create PR
        if: ${{ !inputs.dry_run && steps.check_published.outputs.already_published != 'true' && steps.trigger_type.outputs.is_tag != 'true' }}
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b cli/bump-version-v${{ steps.version.outputs.version }}
          git add cli/package.json cli/pnpm-lock.yaml
          git commit -m "chore(cli): bump version to v${{ steps.version.outputs.version }}"
          git push origin cli/bump-version-v${{ steps.version.outputs.version }}
          gh pr create \
            --title "chore(cli): bump version to v${{ steps.version.outputs.version }}" \
            --body "Automated version bump after publishing \`@rajbos/ai-engineering-fluency@${{ steps.version.outputs.version }}\` to npm." \
            --base main \
            --head cli/bump-version-v${{ steps.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The notes are the "## [<version>]" section of cli/CHANGELOG.md, written in
      # the release-prep PR (scripts/release-changelog.js promote). The tag is
      # already pushed and the package already on npm here, so a missing section
      # warns and falls back to GitHub's generated PR list instead of failing.
      - name: Read release notes from CHANGELOG.md
        if: ${{ !inputs.dry_run && steps.check_published.outputs.already_published != 'true' && steps.trigger_type.outputs.is_tag == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG_NAME="cli/v${VERSION}"
          if gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${TAG_NAME}" --jq '.body' > /tmp/generated_notes.md 2>/dev/null \
            && [ -s /tmp/generated_notes.md ]; then
            HAVE_GENERATED=true
          else
            HAVE_GENERATED=false
          fi

          if node scripts/release-changelog.js extract cli/CHANGELOG.md "$VERSION" --out /tmp/release_notes.md; then
            echo "✅ Release notes from cli/CHANGELOG.md"
            if [ "$HAVE_GENERATED" = "true" ]; then
              {
                echo ""
                echo "<details><summary>All merged pull requests</summary>"
                echo ""
                cat /tmp/generated_notes.md
                echo ""
                echo "</details>"
              } >> /tmp/release_notes.md
            fi
          else
            echo "::warning::cli/CHANGELOG.md has no [${VERSION}] section; using GitHub's generated notes. Write it in the release-prep PR."
            if [ "$HAVE_GENERATED" = "true" ]; then
              cp /tmp/generated_notes.md /tmp/release_notes.md
            else
              echo "CLI v${VERSION}" > /tmp/release_notes.md
            fi
          fi
        working-directory: .

      - name: Create GitHub release
        if: ${{ !inputs.dry_run && steps.check_published.outputs.already_published != 'true' && steps.trigger_type.outputs.is_tag == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          TAG_NAME="cli/v${{ steps.version.outputs.version }}"
          # Attach the attested tarball npm serves, so `gh attestation verify` works on the download.
          gh release create "$TAG_NAME" \
            --title "CLI v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release_notes.md \
            "$TARBALL"
          echo "✅ GitHub release created: $TAG_NAME"
        working-directory: .

      - name: Summary
        run: |
          {
            if [ "${{ steps.check_published.outputs.already_published }}" = "true" ]; then
              echo "## CLI Package Publish Skipped ⏭️"
              echo ""
              echo "Version **v${{ steps.version.outputs.version }}** is already published to npm."
            else
              echo "## CLI Package Published 📦"
              echo ""
              echo "- **Version:** v${{ steps.version.outputs.version }}"
              echo "- **Dry run:** ${{ inputs.dry_run }}"
              echo ""
              if [ "${{ inputs.dry_run }}" = "false" ]; then
                echo "Install with: \`npx @rajbos/ai-engineering-fluency\`"
                echo ""
                if [ "${{ steps.trigger_type.outputs.is_tag }}" = "true" ]; then
                  echo "A GitHub release has been created: cli/v${{ steps.version.outputs.version }}"
                else
                  echo "A PR has been opened to merge the version bump back to main."
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only when the first verification timed out on registry lag: check npm again now
      # that the release steps have run. Fails the run on an integrity or provenance
      # mismatch, or if npm still does not serve the version.
      - name: Re-verify the published package after registry lag
        if: ${{ steps.verify.outputs.timed_out == 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          bash ../.github/workflows/scripts/verify-npm-publish.sh "$PACKAGE_NAME" "$VERSION" "$TARBALL"
