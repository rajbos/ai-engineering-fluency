name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # Path gate. This workflow cross-compiles and tests the VS Code extension, so
  # a PR that only touches docs/, sharing-server/, jetbrains-plugin/ or the
  # Visual Studio extension has nothing here to run. Filtering in a gate job
  # rather than with a `paths:` trigger keeps build-and-test reporting a
  # (skipped) result, so it can stay a required status check - a `paths:`
  # trigger would leave those PRs waiting on a check that never arrives.
  # Mirrors the same pattern in cli-build.yml.
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      build-relevant: ${{ github.event_name == 'push' || steps.filter.outputs.build-relevant == 'true' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for build-relevant file changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build-relevant:
              - 'vscode-extension/**'
              # The extension compiles the shared sources from the repo-root
              # src/ (see vscode-extension/tsconfig.json).
              - 'src/**'
              # Not just the two parse-*.js files invoked directly below: the
              # npm scripts this job runs reach repo-root scripts/ indirectly -
              # lint:json -> validate-json.js, lint:l10n ->
              # validate-localization.js, compile-tests -> prepare-test-output.js,
              # test -> run-node-unit-tests.js, check:contract ->
              # validate-webview-contract.js, check:duplicates ->
              # check-code-duplication.js, check:interaction ->
              # interaction-smoke.js. Narrowing this glob would let a change to
              # the unit-test runner or the contract validator skip CI, so the
              # whole directory stays in scope deliberately.
              - 'scripts/**'
              - '.nvmrc'
              - '.github/workflows/build.yml'

  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.build-relevant == 'true'
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Single-entry matrix: 22.x was dropped - .nvmrc pins 24 and the rest
        # of CI builds on 24 only. This halves the job count, which matters
        # most for the windows/macos rows: those runners are the scarcest and
        # were the slowest to be scheduled.
        node-version: [24.x]
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup Node.js ${{ matrix.node-version }}
      if: matrix.os != 'windows-latest'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: vscode-extension/package-lock.json

    - name: Setup Node.js ${{ matrix.node-version }} (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install dependencies
      working-directory: vscode-extension
      run: npm ci --ignore-scripts
      
    - name: Validate JSON files
      working-directory: vscode-extension
      run: npm run lint:json
      
    - name: Run linting
      working-directory: vscode-extension
      run: npm run lint

    - name: Run complexity analysis
      working-directory: vscode-extension
      shell: bash
      run: npm run --silent lint:report > "$RUNNER_TEMP/lint-output.json" 2>/dev/null || true

    - name: Publish complexity results to step summary
      if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
      shell: bash
      run: node scripts/parse-lint-output.js "$RUNNER_TEMP/lint-output.json" >> "$GITHUB_STEP_SUMMARY"

    - name: Run type checking
      working-directory: vscode-extension
      run: npm run check-types
      
    - name: Compile extension
      working-directory: vscode-extension
      run: npm run compile
      
    - name: Build production package
      working-directory: vscode-extension
      run: npm run package
      
    - name: Compile tests
      working-directory: vscode-extension
      run: npm run compile-tests
      
    - name: Run Node.js unit tests
      working-directory: vscode-extension
      shell: bash
      run: |
        set +e
        node --require ./out/vscode-extension/test/unit/vscode-shim-register.js \
          --experimental-test-coverage \
          --test \
          --test-force-exit \
          --test-coverage-include=out/vscode-extension/src/backend/**/*.js \
          --test-coverage-include=out/vscode-extension/src/utils/**/*.js \
          --test-coverage-include=out/src/utils/**/*.js \
          out/vscode-extension/test/unit/*.test.js 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
        status=${PIPESTATUS[0]}
        set -e
        exit "$status"

    - name: Publish test results to step summary
      if: always()
      shell: bash
      run: node scripts/parse-test-output.js "$RUNNER_TEMP/test-output.txt" >> "$GITHUB_STEP_SUMMARY"

    - name: Verify build outputs exist
      shell: bash
      run: |
        if [ ! -f "vscode-extension/dist/extension.js" ]; then
          echo "❌ vscode-extension/dist/extension.js not found"
          exit 1
        fi
        if [ ! -d "vscode-extension/out" ]; then
          echo "❌ vscode-extension/out directory not found"
          exit 1
        fi
        echo "✅ Build outputs verified"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
      with:
        name: build-artifacts
        path: |
          vscode-extension/dist/extension.js
          vscode-extension/dist/extension.js.map
          vscode-extension/out/
        retention-days: 7

  # Stable required-check anchor.
  #
  # build-and-test keeps a real matrix (3 OSes), and GitHub evaluates a
  # job-level `if` BEFORE expanding the matrix: when the gate skips it, the run
  # reports one skipped check named "build-and-test", not the three
  # "build-and-test (<os>, 24.x)" names it reports when it runs. A required
  # status check cannot match both spellings.
  #
  # Require "Build result" in branch protection rather than the per-OS entries.
  build-result:
    name: Build result
    runs-on: ubuntu-latest
    needs: [check-changes, build-and-test]
    if: always()
    steps:
      - name: Check the gated job results
        env:
          GATE_NAME: check-changes
          GATE: ${{ needs.check-changes.result }}
          RESULTS: |
            build-and-test=${{ needs.build-and-test.result }}
        shell: bash
        run: |
          set -uo pipefail
          # A job downstream of a FAILED `needs` reports as "skipped", not
          # "failure" (verified: run 34755094802, where validate-agent-mirror's
          # propose-fix went skipped after check failed). Since branch
          # protection counts a skipped required check as passing, accepting
          # "skipped" without first proving the gate itself succeeded would let
          # a transient checkout/paths-filter failure wave a PR through with no
          # CI at all. So: the gate must have succeeded before any downstream
          # skip is read as a deliberate decision.
          if [ "$GATE" != "success" ]; then
            echo "::error::$GATE_NAME did not succeed (result: $GATE) - a job skipped downstream of a broken gate is not a pass"
            exit 1
          fi
          status=0
          while IFS='=' read -r job result; do
            [ -z "$job" ] && continue
            case "$result" in
              success|skipped) echo "ok    $job: $result" ;;
              *) echo "::error::$job: $result"; status=1 ;;
            esac
          done <<< "$RESULTS"
          exit "$status"
