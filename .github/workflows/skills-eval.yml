name: Agent Skills Eval

# Weekly evaluation of the Agent Skills in .github/skills using
# https://github.com/darkrishabh/agent-skills-eval, with the GitHub Copilot
# CLI acting as both the target and judge model (see
# .github/workflows/scripts/skills-eval.mjs). Only skills that ship an
# evals/evals.json are evaluated; the rest are skipped by the tool.
#
# No validate-input.sh step: this workflow runs on trusted triggers only
# (schedule / workflow_dispatch / push to workflow files) and never reads
# user-authored event text.
#
# Runs with actionable findings are reported into ONE tracking issue by the
# isolated report-issue job; clean runs touch no issue.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the Copilot CLI (blank = CLI default)"
        required: false
        default: ""
  schedule:
    - cron: '15 6 * * 1'  # Every Monday at 06:15 UTC
  push:
    paths:
      - .github/workflows/skills-eval.yml
      - .github/workflows/scripts/skills-eval.mjs
      - .github/workflows/scripts/skills-eval-issue.mjs
      - .github/workflows/scripts/skills-eval-issue.test.mjs
      - .github/workflows/scripts/skills-eval.test.mjs

permissions:
  contents: read

env:
  # Exact Copilot CLI version run via `npx` here and in
  # .github/workflows/scripts/skills-eval.mjs. Pinned so a new release cannot
  # change the tool and permission flags under this job; keep in step with
  # pr-risk-review.yml and mutation-benchmark.yml.
  COPILOT_CLI_VERSION: "1.0.94"

jobs:
  skills-eval:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')
    timeout-minutes: 90
    outputs:
      report-artifact-url: ${{ steps.upload-report.outputs.artifact-url }}
      workspace-artifact-url: ${{ steps.upload-workspace.outputs.artifact-url }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Check the Copilot CLI token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ GH_PAT secret is not configured — the Copilot CLI cannot authenticate."
            exit 1
          fi
          gh auth status
          npx --yes "@github/copilot@${COPILOT_CLI_VERSION}" --version

      - name: Install agent-skills-eval
        working-directory: .github/workflows/dependencies/agent-skills-eval
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run agent-skills-eval via the Copilot CLI
        id: eval
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          EVAL_PKG_DIR: .github/workflows/dependencies/agent-skills-eval
          COPILOT_MODEL: ${{ inputs.model || '' }}
          SKILLS_ROOT: .github/skills
          EVAL_WORKSPACE: ./agent-skills-workspace
        run: node .github/workflows/scripts/skills-eval.mjs

      - name: Upload eval workspace (raw prompts, outputs and gradings)
        id: upload-workspace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skills-eval-workspace
          path: agent-skills-workspace/
          if-no-files-found: warn
          retention-days: 90

      # The report also lives inside the workspace artifact above, but it is
      # buried several levels deep in a large zip. Upload the report directory
      # itself (reported by the eval script) so this artifact unzips to a bare
      # index.html that can be opened directly.
      - name: Upload HTML report
        id: upload-report
        if: always() && steps.eval.outputs.report-dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skills-eval-report
          path: ${{ steps.eval.outputs.report-dir }}
          if-no-files-found: warn
          retention-days: 90

      # The ONLY eval output the issue reporter sees: the runner's sanitized
      # summary, never the raw workspace. A missing file is not an error here;
      # the reporter turns it into an operational finding.
      - name: Upload sanitized actionable summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skills-eval-actionable
          path: agent-skills-workspace/eval-actionable.json
          if-no-files-found: ignore
          retention-days: 90

  # Unit tests for the eval runner and the issue reporter. No secrets, no
  # model calls, no GitHub API writes: fixtures and fakes only.
  script-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # The runner tests import the pinned agent-skills-eval SDK.
      - name: Install agent-skills-eval
        working-directory: .github/workflows/dependencies/agent-skills-eval
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run eval runner and issue reporter unit tests
        run: >-
          node --test
          .github/workflows/scripts/skills-eval.test.mjs
          .github/workflows/scripts/skills-eval-issue.test.mjs

  # Files or refreshes ONE tracking issue when the run has something to act on
  # (see .github/workflows/scripts/skills-eval-issue.mjs). Isolated from the
  # eval job: it holds issues:write but never the Copilot PAT, the model, or
  # the raw workspace, only the sanitized summary and the eval job's result.
  # Default-branch runs only, so pushes to feature branches never file issues.
  # `!cancelled()` rather than `always()`: a run a person cancels is not a
  # finding, while a failed or timed-out eval job still is.
  report-issue:
    needs: [skills-eval, script-tests]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.skills-eval.result != 'skipped' &&
      needs.script-tests.result == 'success' &&
      github.ref_name == github.event.repository.default_branch
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # create / update / reopen the single tracking issue
    # One reporter at a time across all runs, so two runs cannot both see "no
    # issue yet" and create duplicates. Queue, never cancel, a reporter.
    concurrency:
      group: skills-eval-issue-report
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout reporter script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # Missing when the eval job died before writing it; the reporter handles
      # that as an operational finding, so do not fail here.
      - name: Download sanitized actionable summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-skills-eval-actionable
          path: ${{ runner.temp }}/skills-eval-summary

      - name: Create, update or reopen the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_JOB_RESULT: ${{ needs.skills-eval.result }}
          SUMMARY_FILE: ${{ runner.temp }}/skills-eval-summary/eval-actionable.json
          REPORT_ARTIFACT_URL: ${{ needs.skills-eval.outputs.report-artifact-url }}
          WORKSPACE_ARTIFACT_URL: ${{ needs.skills-eval.outputs.workspace-artifact-url }}
        run: node .github/workflows/scripts/skills-eval-issue.mjs