name: actionlint

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

# One run per PR (or ref). A newer push to the same PR supersedes the
# in-flight run, so cancel it; pushes to branches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Block all outbound calls except allowed)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: block
          # Allowlist inferred from the harden-runner audit output of the 10 most
          # recent successful runs of this workflow (run ids 28548602130..28791579209).
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: devops-actions/actionlint@v0.1.13
