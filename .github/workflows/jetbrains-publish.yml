name: JetBrains Plugin - Publish

# Trigger on a versioned tag push (for automated releases) or manually.
#
# Tag convention: jetbrains/v<version>  (e.g. jetbrains/v0.1.0)
# The version in jetbrains-plugin/gradle.properties MUST match the pushed tag.
#
# Required secret:
#   JB_PUBLISH_TOKEN — personal token from https://plugins.jetbrains.com/author/me/tokens
#
# Build pipeline:
#   1. Three parallel CLI builds (Windows / macOS / Linux) produce platform binaries.
#   2. One vscode-extension build produces the webview JS bundles.
#   3. A final job assembles all assets, runs `./gradlew buildPlugin`, and
#      optionally runs `./gradlew publishPlugin` to upload to the Marketplace.

on:
  push:
    tags:
      - 'jetbrains/v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to JetBrains Marketplace after building'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run: build the plugin ZIP but do not publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1a — CLI binary: Windows (.exe + sql-wasm.wasm)
  # ─────────────────────────────────────────────────────────────────────────────
  build-cli-windows:
    name: Build CLI (Windows)
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build and bundle Windows executable
        working-directory: cli
        run: pwsh -NoProfile -File bundle-exe.ps1

      - name: Smoke-test the executable
        working-directory: cli
        run: dist\copilot-token-tracker.exe --version

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-windows
          path: |
            cli/dist/copilot-token-tracker.exe
            cli/dist/sql-wasm.wasm
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1b — CLI binary: macOS ARM64 (Apple Silicon)
  # ─────────────────────────────────────────────────────────────────────────────
  build-cli-macos-arm64:
    name: Build CLI (macOS ARM64)
    runs-on: macos-15   # pinned Apple Silicon runner (M-series); do not use macos-latest (label shifts)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build production bundle
        working-directory: cli
        run: node esbuild.js --production

      - name: Build macOS ARM64 SEA binary
        working-directory: cli
        run: |
          node --experimental-sea-config sea-config.json
          cp "$(which node)" dist/copilot-token-tracker-macos-arm64
          npx --yes postject dist/copilot-token-tracker-macos-arm64 NODE_SEA_BLOB dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          chmod +x dist/copilot-token-tracker-macos-arm64

      - name: Smoke-test the binary
        working-directory: cli
        run: dist/copilot-token-tracker-macos-arm64 --version

      - name: Upload macOS ARM64 CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-macos-arm64
          path: cli/dist/copilot-token-tracker-macos-arm64
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1c — CLI binary: macOS x64 (Intel)
  # Note: macos-13 is the last available Intel macOS runner on GitHub Actions.
  # ─────────────────────────────────────────────────────────────────────────────
  build-cli-macos-x64:
    name: Build CLI (macOS x64)
    runs-on: macos-15-intel   # Intel (x64) macOS runner; macos-13 is no longer available
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build production bundle
        working-directory: cli
        run: node esbuild.js --production

      - name: Build macOS x64 SEA binary
        working-directory: cli
        run: |
          node --experimental-sea-config sea-config.json
          cp "$(which node)" dist/copilot-token-tracker-macos-x64
          npx --yes postject dist/copilot-token-tracker-macos-x64 NODE_SEA_BLOB dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          chmod +x dist/copilot-token-tracker-macos-x64

      - name: Smoke-test the binary
        working-directory: cli
        run: dist/copilot-token-tracker-macos-x64 --version

      - name: Upload macOS x64 CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-macos-x64
          path: cli/dist/copilot-token-tracker-macos-x64
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 1c — CLI binary: Linux
  # ─────────────────────────────────────────────────────────────────────────────
  build-cli-linux:
    name: Build CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build production bundle
        working-directory: cli
        run: node esbuild.js --production

      - name: Build Linux SEA binary
        working-directory: cli
        run: |
          node --experimental-sea-config sea-config.json
          cp "$(which node)" dist/copilot-token-tracker-linux
          npx --yes postject dist/copilot-token-tracker-linux NODE_SEA_BLOB dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x dist/copilot-token-tracker-linux

      - name: Smoke-test the binary
        working-directory: cli
        run: dist/copilot-token-tracker-linux --version

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-linux
          path: cli/dist/copilot-token-tracker-linux
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 2 — Compile the webview JS bundles (vscode-extension produces them)
  # ─────────────────────────────────────────────────────────────────────────────
  build-webview:
    name: Build webview bundles
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Build webview bundles
        working-directory: vscode-extension
        run: npm run compile

      - name: Upload webview bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webview-bundles
          path: vscode-extension/dist/webview/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 3 — Assemble, build the plugin, and optionally publish
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-publish:
    name: Build and Publish Plugin
    runs-on: ubuntu-latest
    needs: [build-cli-windows, build-cli-macos-arm64, build-cli-macos-x64, build-cli-linux, build-webview]
    permissions:
      contents: write   # needed to create GitHub release on tag push
    outputs:
      plugin_version: ${{ steps.version.outputs.plugin_version }}
      is_tag: ${{ steps.version.outputs.is_tag }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Place CLI binaries and webview bundles
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts/ -type f | sort

          mkdir -p cli/dist vscode-extension/dist/webview

          # CLI binaries (sql-wasm.wasm is the same on all platforms; one copy suffices)
          # Note: actions/upload-artifact strips the common leading directory of the
          # listed paths, so files land flat at the artifact root (not under cli/dist/).
          cp artifacts/cli-windows/copilot-token-tracker.exe      cli/dist/
          cp artifacts/cli-windows/sql-wasm.wasm                  cli/dist/
          cp artifacts/cli-macos-arm64/copilot-token-tracker-macos-arm64  cli/dist/
          cp artifacts/cli-macos-x64/copilot-token-tracker-macos-x64      cli/dist/
          cp artifacts/cli-linux/copilot-token-tracker-linux       cli/dist/

          # Webview JS bundles (built by vscode-extension; also flattened at upload)
          # -r because the bundle includes the codicons/ subdirectory
          cp -r artifacts/webview-bundles/*  vscode-extension/dist/webview/

          # Make unix binaries executable
          chmod +x cli/dist/copilot-token-tracker-macos-arm64 cli/dist/copilot-token-tracker-macos-x64 cli/dist/copilot-token-tracker-linux

          echo ""
          echo "=== cli/dist ==="
          ls -lh cli/dist/
          echo ""
          echo "=== vscode-extension/dist/webview ==="
          ls -lh vscode-extension/dist/webview/

      - name: Read plugin version from gradle.properties
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PLUGIN_VERSION=$(grep '^pluginVersion' jetbrains-plugin/gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" && "$GIT_REF" == refs/tags/jetbrains/v* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            TAG_VERSION="${GIT_REF#refs/tags/jetbrains/v}"
            echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
              echo "❌ Version mismatch!"
              echo "  gradle.properties: $PLUGIN_VERSION"
              echo "  tag:               $TAG_VERSION"
              echo "Please bump pluginVersion in jetbrains-plugin/gradle.properties to match the tag."
              exit 1
            fi
            echo "✅ Version check passed: $PLUGIN_VERSION"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin ZIP
        working-directory: jetbrains-plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin ZIP was produced
        run: |
          ZIP=$(find jetbrains-plugin/build/distributions/ -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "❌ No plugin ZIP found in jetbrains-plugin/build/distributions/"
            exit 1
          fi
          SIZE=$(du -sh "$ZIP" | cut -f1)
          echo "✅ Plugin ZIP: $ZIP ($SIZE)"

      - name: Assert all CLI bundles are present in the ZIP
        run: |
          ZIP=$(find jetbrains-plugin/build/distributions/ -name "*.zip" | head -1)
          # The plugin ZIP only contains the plugin's lib/*.jar files at its top level.
          # Gradle's `sourceSets.main.resources` bundling packs our CLI/webview assets
          # *inside* the main plugin jar (so the plugin can load them via the
          # classloader), not as loose files in the outer ZIP. So we must inspect the
          # nested jar's entries, not the outer ZIP's.
          WORKDIR=$(mktemp -d)
          unzip -q "$ZIP" -d "$WORKDIR"
          JAR=$(find "$WORKDIR" -name "*.jar" ! -name "*-searchableOptions.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "❌ Could not find the plugin's main jar inside $ZIP"
            exit 1
          fi
          MISSING=()
          for ENTRY in \
            "cli-bundle/win-x64/copilot-token-tracker.exe" \
            "cli-bundle/darwin-arm64/copilot-token-tracker" \
            "cli-bundle/darwin-x64/copilot-token-tracker" \
            "cli-bundle/linux-x64/copilot-token-tracker"; do
            if ! unzip -l "$JAR" | grep -q "$ENTRY"; then
              MISSING+=("$ENTRY")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing CLI bundle entries in plugin jar ($JAR):"
            for M in "${MISSING[@]}"; do echo "  - $M"; done
            exit 1
          fi
          echo "✅ All CLI bundles present in plugin jar"

      - name: Publish to JetBrains Marketplace
        # Publish on tag push, or on workflow_dispatch when explicitly requested
        if: ${{ inputs.dry_run != true && (github.event_name == 'push' || inputs.publish_marketplace == true) }}
        working-directory: jetbrains-plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JB_PUBLISH_TOKEN }}

      - name: Upload plugin ZIP as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jetbrains-plugin-${{ steps.version.outputs.plugin_version }}
          path: jetbrains-plugin/build/distributions/*.zip
          retention-days: 30

      - name: Generate release notes
        id: release_notes
        if: ${{ steps.version.outputs.is_tag == 'true' && inputs.dry_run != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="jetbrains/v${{ steps.version.outputs.plugin_version }}"
          if gh api "repos/${{ github.repository }}/releases/generate-notes" \
               -f tag_name="${TAG_NAME}" \
               --jq '.body' > /tmp/release_notes.md 2>/dev/null \
             && [ -s /tmp/release_notes.md ]; then
            echo "✅ Generated release notes from merged PRs"
          else
            echo "JetBrains Plugin v${{ steps.version.outputs.plugin_version }}" > /tmp/release_notes.md
          fi

      - name: Create GitHub release
        if: ${{ steps.version.outputs.is_tag == 'true' && inputs.dry_run != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="jetbrains/v${{ steps.version.outputs.plugin_version }}"
          ZIP=$(find jetbrains-plugin/build/distributions/ -name "*.zip" | head -1)
          gh release create "$TAG_NAME" \
            --title "JetBrains Plugin v${{ steps.version.outputs.plugin_version }}" \
            --notes-file /tmp/release_notes.md \
            "$ZIP"
          echo "✅ GitHub release created: $TAG_NAME"

      - name: Summary
        run: |
          {
            echo "## JetBrains Plugin Build 🧩"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | v${{ steps.version.outputs.plugin_version }} |"
            echo "| **Trigger** | ${{ github.event_name }} |"
            echo "| **Dry run** | ${{ inputs.dry_run || 'false' }} |"
            if [ "${{ inputs.dry_run }}" != "true" ] && \
               { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish_marketplace }}" = "true" ]; }; then
              echo "| **Marketplace** | ✅ Published |"
            else
              echo "| **Marketplace** | ⏭️ Skipped |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 4 — Poll JetBrains Marketplace for the automated Plugin Verifier result
  # ─────────────────────────────────────────────────────────────────────────────
  # JetBrains runs the Plugin Verifier automatically right after a version is
  # uploaded. If it finds no blocking issues the update is auto-approved within
  # minutes; if it flags something (e.g. Internal/deprecated API usage) the
  # update stays unapproved and JetBrains emails the author instead of failing
  # the upload itself — so a bad release could otherwise go unnoticed here.
  # This job polls the public, unauthenticated Marketplace API for that
  # approval flag so a stuck/rejected verification shows up as a failed
  # GitHub Actions run instead of relying on someone reading email.
  verify-marketplace-approval:
    name: Verify Marketplace Approval
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: ${{ needs.build-and-publish.outputs.is_tag == 'true' && inputs.dry_run != true }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Wait for JetBrains Plugin Verifier and poll approval status
        env:
          PLUGIN_ID: '31580' # numeric JetBrains Marketplace id for ai-engineering-fluency
          PLUGIN_VERSION: ${{ needs.build-and-publish.outputs.plugin_version }}
        run: |
          # Give JetBrains a head start before the first poll.
          echo "⏳ Waiting 3 minutes before the first check to let the Plugin Verifier start..."
          sleep 180

          MAX_ATTEMPTS=15
          SLEEP_SECONDS=120
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo ""
            echo "=== Attempt $ATTEMPT/$MAX_ATTEMPTS: checking plugin $PLUGIN_ID (v$PLUGIN_VERSION) ==="

            INFO=$(curl -sf "https://plugins.jetbrains.com/api/plugins/${PLUGIN_ID}") || {
              echo "⚠️ Could not reach JetBrains Marketplace API, retrying..."
              sleep "$SLEEP_SECONDS"
              continue
            }

            HAS_UNAPPROVED=$(echo "$INFO" | jq -r '.hasUnapprovedUpdate')
            echo "hasUnapprovedUpdate: $HAS_UNAPPROVED"

            if [ "$HAS_UNAPPROVED" = "false" ]; then
              echo "✅ No pending unapproved update — the Plugin Verifier passed and v$PLUGIN_VERSION is live."
              echo "verified=true" >> "$GITHUB_ENV"
              break
            fi

            echo "⏳ Update still pending verification/approval, waiting ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          if [ "${verified:-false}" != "true" ]; then
            echo "❌ v$PLUGIN_VERSION is still unapproved after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
            echo "This usually means the JetBrains Plugin Verifier flagged an issue (e.g. Internal/deprecated API usage)."
            echo "Check https://plugins.jetbrains.com/plugin/${PLUGIN_ID}-ai-engineering-fluency/versions and your email for details."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## JetBrains Marketplace Verification 🔍"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version checked** | v${{ needs.build-and-publish.outputs.plugin_version }} |"
            if [ "${{ job.status }}" = "success" ]; then
              echo "| **Result** | ✅ Approved — Plugin Verifier passed |"
            else
              echo "| **Result** | ❌ Still unapproved — check email / Marketplace for verifier findings |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
