name: Repo Health Scan

# Daily code-health scan across eight topics (style & validation, naming,
# complexity, large files, dead code, duplication, modularization, tech debt).
#
# - scan (always): runs scripts/repo-health-scan.js — deterministic, no AI cost —
#   writes the report to the step summary and refreshes one long-lived
#   "Repo health dashboard" issue (label: repo-health-dashboard) with the counts
#   and their change since the previous run. That issue is the debt tracker.
# - copilot-handoff (opt-in, costs AI credits): picks ONE untracked finding,
#   opens a `repo-health` issue for it and assigns it to the Copilot coding
#   agent, which works it per .github/agents/repo-health-scan.agent.md.
#   Enable with the repository variable REPO_HEALTH_COPILOT_HANDOFF=true (for
#   the schedule) or the `copilot_handoff` input on a manual run. Leave it off
#   when the fixing half runs as a local Claude Code routine instead
#   (docs/REPO-HEALTH-SCAN.md).

on:
  schedule:
    - cron: '23 5 * * *' # daily 05:23 UTC
  workflow_dispatch:
    inputs:
      copilot_handoff:
        description: 'Open an issue for one finding and assign it to the Copilot coding agent'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/repo-health-scan.yml
      - scripts/repo-health-scan.js
      - scripts/repo-health-scan.test.js

permissions:
  contents: read

concurrency:
  group: repo-health-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run scanner unit tests
        run: node --test scripts/repo-health-scan.test.js

  scan:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      issues: write # refresh the dashboard issue
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install vscode-extension dependencies (ESLint)
        working-directory: vscode-extension
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run repo health scan
        run: |
          mkdir -p "$RUNNER_TEMP/repo-health"
          node scripts/repo-health-scan.js --json --out "$RUNNER_TEMP/repo-health/report.json"
          node scripts/repo-health-scan.js --from "$RUNNER_TEMP/repo-health/report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health-report
          path: ${{ runner.temp }}/repo-health/report.json
          retention-days: 30

      - name: Refresh the dashboard issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create repo-health-dashboard --repo "$REPO" --color 5319e7 \
            --description "Daily repo-health tracking issue" 2>/dev/null || true
          gh label create technical-debt --repo "$REPO" 2>/dev/null || true
          number=$(gh issue list --repo "$REPO" --label repo-health-dashboard --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          : > "$RUNNER_TEMP/previous.md"
          if [ -n "$number" ]; then
            gh issue view "$number" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/previous.md"
          fi
          node scripts/repo-health-scan.js --dashboard --from "$RUNNER_TEMP/repo-health/report.json" \
            --previous "$RUNNER_TEMP/previous.md" --out "$RUNNER_TEMP/dashboard.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/dashboard.md"
            echo "Updated dashboard issue #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --repo "$REPO" --title "Repo health dashboard" \
              --label repo-health-dashboard --label technical-debt --body-file "$RUNNER_TEMP/dashboard.md"
          fi

  copilot-handoff:
    needs: scan
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.copilot_handoff) ||
      (github.event_name == 'schedule' && vars.REPO_HEALTH_COPILOT_HANDOFF == 'true')
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download scan report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo-health-report
          path: ${{ runner.temp }}/repo-health

      # Assigning an issue to the Copilot coding agent needs a user token;
      # GITHUB_TOKEN cannot. GH_PAT is the same secret sync-toolnames.yml uses.
      - name: Open an issue for one finding and assign it to Copilot
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          MAX_OPEN_PRS: '3'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT is not set; cannot assign issues to Copilot."
            exit 1
          fi
          open_prs=$(gh pr list --repo "$REPO" --label repo-health --state open --json number --jq length)
          if [ "$open_prs" -ge "$MAX_OPEN_PRS" ]; then
            echo "$open_prs repo-health PRs already open (limit $MAX_OPEN_PRS); skipping handoff." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create repo-health --repo "$REPO" --color 0e8a16 \
            --description "Daily repo-health scan finding" 2>/dev/null || true
          gh issue list --repo "$REPO" --label repo-health --state all --limit 1000 \
            --json body > "$RUNNER_TEMP/tracked.json"
          node scripts/repo-health-scan.js --pick --from "$RUNNER_TEMP/repo-health/report.json" \
            --tracked "$RUNNER_TEMP/tracked.json" --out "$RUNNER_TEMP/pick.json"
          if [ "$(jq -r '.finding == null' "$RUNNER_TEMP/pick.json")" = "true" ]; then
            echo "No untracked finding to hand off." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title=$(jq -r '.issue.title' "$RUNNER_TEMP/pick.json")
          {
            jq -r '.issue.body' "$RUNNER_TEMP/pick.json"
            echo
            echo "_@copilot: work this with \`.github/agents/repo-health-scan.agent.md\`, starting at Step 4._"
          } > "$RUNNER_TEMP/issue.md"
          url=$(gh issue create --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/issue.md" \
            --label repo-health --label technical-debt)
          gh issue edit "$url" --repo "$REPO" --add-assignee "@copilot"
          echo "Handed off $url to the Copilot coding agent." >> "$GITHUB_STEP_SUMMARY"
