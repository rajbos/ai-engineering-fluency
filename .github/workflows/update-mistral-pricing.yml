name: Update Mistral Pricing

on:
  schedule:
    # Run daily at 09:15 UTC, after the model data update
    - cron: '15 9 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-mistral-pricing.yml
      - scripts/update-mistral-pricing.py

permissions:
  contents: read

jobs:
  update-mistral-pricing:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')

    permissions:
      contents: write      # needed to create branches and push changes
      pull-requests: write  # needed to create PRs

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'

      - name: Update Mistral pricing
        id: update
        run: |
          python scripts/update-mistral-pricing.py | tee /tmp/update-output.txt
          echo "status=success" >> "$GITHUB_OUTPUT"
          cat /tmp/update-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js (for JSON validation)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Validate JSON files
        working-directory: vscode-extension
        run: npm run lint:json

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/mistral-pricing
          add-paths: |
            vscode-extension/src/modelPricing.json
          commit-message: |
            chore: update Mistral model pricing from OpenRouter API

            Updates inputCostPerMillion and outputCostPerMillion for Mistral
            models from the OpenRouter API.
          title: "chore: update Mistral model pricing from OpenRouter API"
          body: |
            This pull request updates Mistral model pricing with the latest
            data from [OpenRouter API](https://openrouter.ai/api/v1/models).

            **Updated Files:**
            - `vscode-extension/src/modelPricing.json` — Mistral model pricing

            **⚠️ Note:** New model entries are added with default tier and multiplier
            values and may require manual verification.

            ---

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            autogenerated
            maintenance

      - name: Summary
        run: |
          if [ "${{ steps.create_pr.outputs.pull-request-created }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Pull request created: ${{ steps.create_pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.create_pr.outputs.pull-request-number }}" != "" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔄 Existing pull request updated: ${{ steps.create_pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ️ Mistral pricing is already up to date — no pull request needed." >> "$GITHUB_STEP_SUMMARY"
          fi
