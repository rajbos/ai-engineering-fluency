name: Download Milestone Tracker

on:
  schedule:
    # Sunday night UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-milestone:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Restore last announced milestone
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/download-milestone-state.json
          key: download-milestone-state-${{ github.run_id }}
          restore-keys: |
            download-milestone-state-

      - name: Check for a new download milestone
        id: milestone
        run: python scripts/check-download-milestone.py

      - name: Create milestone issue
        if: steps.milestone.outputs.milestone_reached == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MILESTONE_FORMATTED: ${{ steps.milestone.outputs.milestone_formatted }}
        run: |
          gh issue create \
            --repo "$REPO" \
            --title "🎉 Download milestone: ${MILESTONE_FORMATTED} total downloads" \
            --body-file /tmp/download-milestone-issue-body.md \
            --label "autogenerated"

      # Only re-saved when a new milestone was actually reached, so the cache
      # entry (and thus the "last milestone we alerted on") only advances
      # once we've successfully announced it.
      - name: Save milestone state
        if: steps.milestone.outputs.milestone_reached == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/download-milestone-state.json
          key: download-milestone-state-${{ github.run_id }}
