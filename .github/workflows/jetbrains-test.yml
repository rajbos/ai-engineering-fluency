name: JetBrains Plugin - Tests

# Runs the JetBrains plugin's unit tests on pull requests, so a broken localization
# payload (or a test that no longer compiles) is found before merge rather than at
# release time. jetbrains-publish.yml only runs on jetbrains/v* tags and manual dispatch.
#
# The tests are pure JVM (no IDE is launched). Webview bundles and CLI binaries are
# not needed: the tests inject a fake resource loader, and prepareBundledAssets
# tolerates missing files.
on:
  pull_request:
    paths:
      - 'jetbrains-plugin/**'
      # Inputs the localization sidecar tests/contract depend on.
      - 'vscode-extension/package.nls*.json'
      - 'vscode-extension/src/webview/shared/webviewKeys.json'
      - 'vscode-extension/scripts/webviewLocalizationSidecars.js'
      - '.github/workflows/jetbrains-test.yml'

permissions:
  contents: read

# One run per PR (or ref). A newer push to the same PR supersedes the
# in-flight run, so cancel it; pushes to branches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Gradle unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          min-wrapper-count: 1

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit tests
        working-directory: jetbrains-plugin
        run: ./gradlew test
