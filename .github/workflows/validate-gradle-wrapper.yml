name: Validate Gradle Wrapper

on:
  push:
    paths:
      - '.github/workflows/validate-gradle-wrapper.yml'
      - 'jetbrains-plugin/gradlew'
      - 'jetbrains-plugin/gradlew.bat'
      - 'jetbrains-plugin/gradle/wrapper/**'
  pull_request:
    paths:
      - '.github/workflows/validate-gradle-wrapper.yml'
      - 'jetbrains-plugin/gradlew'
      - 'jetbrains-plugin/gradlew.bat'
      - 'jetbrains-plugin/gradle/wrapper/**'

permissions:
  contents: read

# One run per PR (or ref). A newer push to the same PR supersedes the
# in-flight run, so cancel it; pushes to branches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-gradle-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@v6.4.1
        with:
          min-wrapper-count: 1
