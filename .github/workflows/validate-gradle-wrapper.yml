name: Validate Gradle Wrapper

on:
  push:
    paths:
      - '.github/workflows/validate-gradle-wrapper.yml'
      - 'jetbrains-plugin/gradlew'
      - 'jetbrains-plugin/gradlew.bat'
      - 'jetbrains-plugin/gradle/wrapper/**'
  pull_request:
    paths:
      - '.github/workflows/validate-gradle-wrapper.yml'
      - 'jetbrains-plugin/gradlew'
      - 'jetbrains-plugin/gradlew.bat'
      - 'jetbrains-plugin/gradle/wrapper/**'

permissions:
  contents: read

jobs:
  validate-gradle-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          min-wrapper-count: 1
