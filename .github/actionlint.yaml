# actionlint configuration (https://github.com/rhysd/actionlint/blob/main/docs/config.md)
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # `uses: $/<path>` runs a same-repo action pinned to the workflow's own
      # commit. It is the form the workflow lockfile (.github/workflows/actions.lock,
      # generated by `gh actions-lock --migrate-local-actions`) requires for local
      # actions, but actionlint does not understand it yet.
      - 'specifying action "\$/.+" in invalid format because ref is missing'
