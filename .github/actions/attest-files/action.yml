name: 'Attest release files'
description: >-
  Create a GitHub build-provenance attestation for one or more files, verify each file
  against it (restricted to this repository, this workflow file, this ref and
  GitHub-hosted runners), and optionally download the same-named assets from a GitHub
  release and verify those too, proving the published bytes are the attested ones.
  The CALLING JOB must grant `id-token: write`, `attestations: write` and (for
  `release-tag`) `contents: read`, and must have `gh` on PATH.

inputs:
  subject-path:
    description: 'Newline-separated paths or globs of the files to attest'
    required: true
  github-token:
    description: 'Token used by gh attestation verify and gh release download'
    required: true
  release-tag:
    description: >-
      Optional release tag. When set, every attested file that is also an asset of this
      release is downloaded from the release and verified against the attestations.
    required: false
    default: ''

outputs:
  bundle-path:
    description: 'Path to the attestation bundle written by actions/attest-build-provenance'
    value: ${{ steps.attest.outputs.bundle-path }}

runs:
  using: composite
  steps:
    - name: Attest build provenance
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}

    - name: Verify attestations (local files and release assets)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SUBJECT_PATH: ${{ inputs.subject-path }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: bash "$GITHUB_ACTION_PATH/verify.sh"
